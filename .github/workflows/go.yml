name: Go and GUI CI

on:
  push:
    branches: [main, gui]
  pull_request:
    branches: [main, gui]

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal gui/*.go gui/internal)"
      - name: Test release and installer tools
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test with race detection
        run: go test -race -count=1 -timeout=120s '-coverprofile=coverage.out' ./cmd/... ./internal/...
      - name: Build CLI
        run: go build ./cmd/gotun

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            platform: darwin/universal
          - os: windows-latest
            platform: windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Wails CLI
        shell: bash
        run: |
          version=$(cd gui && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"
      - name: Generate bindings and install frontend dependencies
        run: make gui-bindings frontend-install
      - name: Test frontend
        working-directory: gui/frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: gui/frontend
        run: npm run build
      - name: Vet GUI
        working-directory: gui
        run: go vet ./...
      - name: Test GUI with race detection
        working-directory: gui
        run: go test -race -count=1 -timeout=120s '-coverprofile=coverage.out' ./...
      - name: Build native GUI
        run: python scripts/release.py build-gui --version dev --platform ${{ matrix.platform }}

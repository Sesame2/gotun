name: Go and GUI CI

on:
  push:
    branches: [main, gui]
  pull_request:
    branches: [main, gui]

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal gui/*.go)"
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Test with race detection
        run: go test -race -count=1 -timeout=120s -coverprofile=coverage.out ./cmd/... ./internal/...
      - name: Build CLI
        run: go build ./cmd/gotun

  gui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      - name: Generate bindings and install frontend dependencies
        run: make gui-bindings frontend-install
      - name: Test frontend
        working-directory: gui/frontend
        run: npm run test:coverage
      - name: Build frontend
        working-directory: gui/frontend
        run: npm run build
      - name: Vet GUI
        working-directory: gui
        run: go vet ./...
      - name: Test GUI with race detection
        working-directory: gui
        run: go test -race -count=1 -timeout=120s -coverprofile=coverage.out ./...
      - name: Build native GUI
        working-directory: gui
        run: wails build -s -skipbindings -m -nosyncgomod
